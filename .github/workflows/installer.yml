name: Installer
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pyinstaller>=6,<7'
      - run: python -m PyInstaller --onefile --windowed --name Instalar-Arquivos installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: Instalar-Arquivos-Windows
          path: dist/Instalar-Arquivos.exe
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # .NET Framework 4.8 (part of Windows 10 and 11): the player installs nothing to run it.
      # Version: the tag (v0.4.0 -> 0.4.0), or for every other build the newest tag plus the run number
      # (0.4.0.57), so the launcher's update channels can tell builds apart; the commit goes in too.
      - shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else {
            $tag = git describe --tags --abbrev=0 --match 'v*' 2>$null
            $base = if ($tag) { $tag.Substring(1) } else { '0.1.0' }
            $v = "$base.$env:GITHUB_RUN_NUMBER"
          }
          "VERSION=$v" >> $env:GITHUB_ENV
          dotnet build launcher/Launcher.csproj -c Release -o dist -p:Version=$v -p:SourceRevisionId=$env:GITHUB_SHA
      # Launcher.zip: the launcher alone (it downloads recompilers itself).
      - shell: pwsh
        run: Compress-Archive -Path dist/Launcher.exe -DestinationPath dist/Launcher.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher
          path: |
            dist/Launcher.exe
            dist/Launcher.zip
      # Nightly channel: every push to main replaces the "nightly" pre-release with this build.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Nightly build of the launcher (the newest commit; may be less tested than a release).
          commit: $GITHUB_SHA
          version: $VERSION
          Source code only; nothing from any game."
          gh release delete nightly -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/Launcher.exe dist/Launcher.zip -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Nightly ($VERSION)" --notes "$notes"
  # One ZIP per recompiler for a release: its source with Launcher.exe at the root and Python, CMake and Ninja
  # already inside (tools/make_bundle.py). Players open Launcher.exe; nothing to install first.
  bundles:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [launcher]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: batatinhafcbatatinha-pixel/PS2Recomp, branch: main, name: PS2Recomp, tools: 'cmake,ninja' }
          - { repo: batatinhafcbatatinha-pixel/xboxrecomp, branch: ports, name: xboxrecomp, tools: 'cmake,ninja' }
          - { repo: batatinhafcbatatinha-pixel/rexglue-ports, branch: main, name: rexglue-ports, tools: 'cmake,ninja' }
          - { repo: batatinhafcbatatinha-pixel/PSPRecomp, branch: main, name: PSPRecomp, tools: 'cmake,ninja' }
          - { repo: batatinhafcbatatinha-pixel/AnyPS5, branch: main, name: AnyPS5, tools: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Launcher
          path: dist
      - shell: bash
        run: python tools/make_bundle.py --repo "${{ matrix.repo }}" --branch "${{ matrix.branch }}" --tools "${{ matrix.tools }}" --launcher dist/Launcher.exe --out "out/${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: out/${{ matrix.name }}.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, launcher, bundles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --notes "Download the ZIP of a recompiler (PS2Recomp.zip, rexglue-ports.zip...), unzip it and open Launcher.exe: Python, CMake and Ninja are inside. Or Launcher.zip alone: it downloads recompilers itself. Source code and open tools only; nothing from any game."
          cd assets
          gh release upload "$GITHUB_REF_NAME" Launcher.exe *.zip -R "$GITHUB_REPOSITORY" --clobber
